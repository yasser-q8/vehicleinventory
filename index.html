<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة أسطول المركبات - شركة نايف للأغذية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="https://i.postimg.cc/NM2zJWZD/NAIF-LOGO.jpg" type="image/jpeg">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* الأنماط كما هي (لم يتم تغييرها) */
        :root {
            --primary-blue: #4a90e2;
            --light-blue: #e3f2fd;
            --dark-blue: #1a237e;
            --accent-red: #e74c3c;
            --accent-red-light: #ffebee;
            --accent-orange: #f39c12;
            --accent-green: #27ae60;
            --accent-green-light: #e8f5e9;
            --accent-purple: #8e44ad;
            --light-gray: #f5f7fa;
            --medium-gray: #e0e0e0;
            --dark-gray: #546e7a;
            --text-dark: #2c3e50;
            --text-light: #757575;
            --white: #ffffff;
            --border-radius: 10px;
            --box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            --box-shadow-light: 0 4px 12px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Cairo', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--light-blue) 0%, #f0f8ff 100%);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* باقي الأنماط كما هي */
        /* ... */
    </style>
</head>
<body>
    <div class="container">
        <!-- الهيكل كما هو مع تعديل قسم موزعين نايف فقط -->
        <div class="header">
            <div class="logo-section">
                <img src="https://i.postimg.cc/NM2zJWZD/NAIF-LOGO.jpg" alt="شعار شركة نايف" class="logo">
                <div class="company-info">
                    <h1>شركة نايف للأغذية</h1>
                    <p>نظام إدارة أسطول المركبات المتكامل</p>
                </div>
            </div>
            <div class="header-controls">
                <div class="date-display">
                    <i class="fas fa-calendar-alt"></i>
                    <span id="currentDate">اليوم: 01-01-2026</span>
                </div>
                <button class="btn btn-outline" id="printBtn">
                    <i class="fas fa-print"></i> طباعة
                </button>
                <button class="btn btn-primary" id="newVehicleBtn">
                    <i class="fas fa-plus"></i> إضافة مركبة
                </button>
            </div>
        </div>

        <!-- Navigation -->
        <div class="main-nav">
            <div class="nav-item active" data-section="dashboard">
                <i class="fas fa-tachometer-alt"></i> لوحة التحكم
            </div>
            <div class="nav-item" data-section="naif-distributors">
                <i class="fas fa-truck"></i> موزعين نايف
            </div>
            <div class="nav-item" data-section="external-distributors">
                <i class="fas fa-shipping-fast"></i> الموزع الخارجي
            </div>
            <div class="nav-item" data-section="reports">
                <i class="fas fa-chart-bar"></i> التقارير
            </div>
            <div class="nav-item" data-section="stores">
                <i class="fas fa-store"></i> الفروع
            </div>
        </div>

        <!-- Dashboard Section -->
        <div class="content-section active" id="dashboard">
            <!-- ... كما هو ... -->
        </div>

        <!-- Naif Distributors Section (معدل) -->
        <div class="content-section" id="naif-distributors">
            <div class="section-header">
                <h2 class="section-title">
                    <i class="fas fa-truck"></i> موزعين نايف
                </h2>
                <div class="action-buttons">
                    <button class="btn btn-primary" id="addNaifVehicle">
                        <i class="fas fa-plus"></i> إضافة مركبة
                    </button>
                    <button class="btn btn-success" id="exportNaif">
                        <i class="fas fa-file-export"></i> تصدير Excel
                    </button>
                </div>
            </div>

            <!-- فلتر جديد: بحث ديناميكي + حالة الإعلان -->
            <div class="filter-section">
                <div class="filter-group" style="flex: 2;">
                    <label for="naifSearch">بحث شامل:</label>
                    <input type="text" class="form-control" id="naifSearch" placeholder="ابحث باسم السائق، رقم السيارة، نوع المركبة، أو الفرع...">
                </div>
                <div class="filter-group">
                    <label for="filterAdvert">حالة الإعلان:</label>
                    <select class="form-control" id="filterAdvert">
                        <option value="">الكل</option>
                        <option value="يوجد اعلان">يوجد إعلان</option>
                        <option value="لا يوجد اعلان">لا يوجد إعلان</option>
                    </select>
                </div>
                <div class="filter-group">
                    <button class="btn btn-danger" id="resetFilters">
                        <i class="fas fa-redo"></i> إعادة تعيين
                    </button>
                </div>
            </div>

            <!-- جدول موزعين نايف -->
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>اسم السائق</th>
                            <th>رقم الهاتف</th>
                            <th>الفرع</th>
                            <th>نوع المركبة</th>
                            <th>رقم السيارة</th>
                            <th>موديل المركبة</th>
                            <th>السنة</th>
                            <th>الإعلان</th>
                            <th>انتهاء الإعلان</th>
                            <th>الشركة</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="naifTableBody">
                        <!-- يتم التعبئة بواسطة JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- External Distributors Section -->
        <div class="content-section" id="external-distributors">
            <!-- ... كما هو ... -->
        </div>

        <!-- باقي الأقسام (Reports, Stores) كما هي -->
        <!-- ... -->
    </div>

    <!-- الشاشات العائمة كما هي -->
    <!-- ... -->

    <script>
        // بيانات المركبات (محدثة حتى يناير 2026)
        const vehiclesData = {
            naif: [
                // ... نفس البيانات المحدثة سابقاً ...
            ],
            external: [
                // ... نفس البيانات المحدثة سابقاً ...
            ]
        };

        // متغيرات الحالة
        let currentSection = 'dashboard';
        let currentEditId = null;
        let allStores = [];
        let allVehicleTypes = [];
        let allCompanies = [];
        let currentYear = 2026;

        // بدء التطبيق
        document.addEventListener('DOMContentLoaded', function() {
            initNavigation();
            initEventListeners();
            updateCurrentDate();
            loadAllData();
            renderDashboard();
            renderNaifDistributors();
            renderExternalDistributors();
            renderStores();
            calculateStatistics();
        });

        // تحديث التاريخ الحالي
        function updateCurrentDate() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            document.getElementById('currentDate').textContent = `اليوم: ${day}-${month}-${year}`;
        }

        // تحميل جميع القيم الفريدة للقوائم المنسدلة
        function loadAllData() {
            const storeSet = new Set();
            const vehicleTypeSet = new Set();
            const companySet = new Set();
            
            vehiclesData.naif.forEach(vehicle => {
                if (vehicle.store) storeSet.add(vehicle.store);
                if (vehicle.vehicleType) vehicleTypeSet.add(vehicle.vehicleType);
                if (vehicle.company) companySet.add(vehicle.company);
            });
            
            vehiclesData.external.forEach(vehicle => {
                if (vehicle.store) storeSet.add(vehicle.store);
                if (vehicle.vehicleType) vehicleTypeSet.add(vehicle.vehicleType);
                if (vehicle.remarks) companySet.add(vehicle.remarks);
            });
            
            allStores = Array.from(storeSet).sort();
            allVehicleTypes = Array.from(vehicleTypeSet).sort();
            allCompanies = Array.from(companySet).sort();
        }

        // التنقل بين الأقسام
        function initNavigation() {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', function() {
                    const section = this.getAttribute('data-section');
                    switchSection(section);
                });
            });
        }

        function switchSection(section) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
                if (item.getAttribute('data-section') === section) {
                    item.classList.add('active');
                }
            });
            
            document.querySelectorAll('.content-section').forEach(content => {
                content.classList.remove('active');
                if (content.id === section) {
                    content.classList.add('active');
                }
            });
            
            currentSection = section;
            
            if (section === 'dashboard') {
                renderDashboard();
                calculateStatistics();
            } else if (section === 'reports') {
                updateReportPreview();
            }
        }

        // إعداد مستمعي الأحداث
        function initEventListeners() {
            // الأزرار العامة
            document.getElementById('newVehicleBtn').addEventListener('click', () => openVehicleForm('add', 'naif'));
            document.getElementById('addNaifVehicle').addEventListener('click', () => openVehicleForm('add', 'naif'));
            document.getElementById('addExternalVehicle').addEventListener('click', () => openVehicleForm('add', 'external'));
            document.getElementById('closeModal').addEventListener('click', closeVehicleForm);
            document.getElementById('cancelForm').addEventListener('click', closeVehicleForm);
            document.getElementById('vehicleForm').addEventListener('submit', handleVehicleFormSubmit);
            
            // فلتر موزعين نايف (الجديد)
            document.getElementById('naifSearch').addEventListener('input', applyNaifFilters);
            document.getElementById('filterAdvert').addEventListener('change', applyNaifFilters);
            document.getElementById('resetFilters').addEventListener('click', resetNaifFilters);
            
            // البحث في الموزع الخارجي
            document.getElementById('externalSearch').addEventListener('input', function() {
                filterExternalTable(this.value.toLowerCase());
            });
            
            // التقارير
            document.getElementById('generateReport').addEventListener('click', generatePDFReport);
            document.getElementById('reportType').addEventListener('change', updateReportPreview);
            document.getElementById('reportStore').addEventListener('input', updateReportPreview);
            document.getElementById('reportMonth').addEventListener('change', updateReportPreview);
            
            // أزرار أخرى
            document.getElementById('refreshStats').addEventListener('click', () => {
                calculateStatistics();
                renderDashboard();
                showAlert('تم تحديث البيانات بنجاح', 'success');
            });
            
            document.getElementById('printBtn').addEventListener('click', printCurrentSection);
            document.getElementById('exportNaif').addEventListener('click', exportNaifToExcel);
        }

        // دالة عرض رسالة تنبيه
        function showAlert(message, type = 'success') {
            const existingAlerts = document.querySelectorAll('.alert');
            existingAlerts.forEach(alert => alert.remove());
            
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                <span>${message}</span>
            `;
            
            document.querySelector('.content-section.active').insertBefore(alertDiv, document.querySelector('.content-section.active').firstChild);
            
            setTimeout(() => {
                if (alertDiv.parentNode) alertDiv.remove();
            }, 5000);
        }

        // عرض لوحة التحكم
        function renderDashboard() {
            const recentVehicles = [...vehiclesData.naif].reverse().slice(0, 8);
            const recentTable = document.getElementById('recentVehiclesTable');
            recentTable.innerHTML = '';
            
            recentVehicles.forEach(vehicle => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${vehicle.driverName}</td>
                    <td>${vehicle.vehicleNumber}</td>
                    <td>${vehicle.vehicleType}</td>
                    <td>${vehicle.store || '-'}</td>
                    <td>${vehicle.vehicleModel || '-'}</td>
                    <td>
                        <span class="status-badge ${getAdvertStatusClass(vehicle)}">
                            ${getAdvertStatusText(vehicle)}
                        </span>
                    </td>
                    <td class="action-cell">
                        <button class="action-btn edit-btn" onclick="editVehicle(${vehicle.id}, 'naif')">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="action-btn delete-btn" onclick="deleteVehicle(${vehicle.id}, 'naif')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                recentTable.appendChild(row);
            });
        }

        // دوال مساعدة لحالة الإعلان
        function getAdvertStatusClass(vehicle) {
            if (!vehicle.advert) return 'status-inactive';
            if (vehicle.advert === 'يوجد اعلان') {
                if (vehicle.expDate) {
                    const expDate = new Date(vehicle.expDate);
                    const today = new Date();
                    const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
                    if (diffDays <= 30 && diffDays > 0) return 'status-expiring';
                    if (diffDays <= 0) return 'status-inactive';
                }
                return 'status-active';
            }
            return 'status-inactive';
        }

        function getAdvertStatusText(vehicle) {
            if (!vehicle.advert) return 'غير محدد';
            if (vehicle.advert === 'يوجد اعلان') {
                if (vehicle.expDate) {
                    const expDate = new Date(vehicle.expDate);
                    const today = new Date();
                    const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
                    if (diffDays <= 30 && diffDays > 0) return `ينتهي خلال ${diffDays} يوم`;
                    if (diffDays <= 0) return 'منتهي';
                }
                return 'نشط';
            }
            return 'غير نشط';
        }

        // حساب الإحصائيات
        function calculateStatistics() {
            let totalCars = 0, totalBikes = 0, totalWithAd = 0, expiringSoon = 0;
            
            const countVehicle = (vehicle) => {
                const type = vehicle.vehicleType.toLowerCase();
                if (type.includes('سياره') || type.includes('car') || type.includes('نيسان') || type.includes('تويتا') || type.includes('تويوتا') || type.includes('سوزوكي') || type.includes('كيا') || type.includes('كورولا') || type.includes('جيلي') || type.includes('شانجان') || type.includes('رينو') || type.includes('شيرى') || type.includes('ميتسوبيش') || type.includes('ماتسوبيشى') || type.includes('دياهتسو') || type.includes('سيلره') || type.includes('سوزكي') || type.includes('لانسر')) {
                    totalCars++;
                } else if (type.includes('بجاج') || type.includes('bike') || type.includes('bk') || type.includes('هيرو') || type.includes('sym') || type.includes('دراجه') || type.includes('سيكل') || type.includes('بيجاج') || type.includes('هوندا') || type.includes('بوكسر') || type.includes('بوكس')) {
                    totalBikes++;
                }
            };
            
            vehiclesData.naif.forEach(vehicle => {
                countVehicle(vehicle);
                if (vehicle.advert === 'يوجد اعلان') {
                    totalWithAd++;
                    if (vehicle.expDate) {
                        const diffDays = Math.ceil((new Date(vehicle.expDate) - new Date()) / (1000 * 60 * 60 * 24));
                        if (diffDays > 0 && diffDays <= 30) expiringSoon++;
                    }
                }
            });
            
            vehiclesData.external.forEach(vehicle => {
                countVehicle(vehicle);
            });
            
            document.getElementById('totalCars').textContent = totalCars;
            document.getElementById('totalBikes').textContent = totalBikes;
            document.getElementById('totalWithAd').textContent = totalWithAd;
            document.getElementById('expiringSoon').textContent = expiringSoon;
        }

        // عرض موزعين نايف مع تطبيق الفلاتر
        function renderNaifDistributors(filteredData = null) {
            const data = filteredData || vehiclesData.naif;
            const tableBody = document.getElementById('naifTableBody');
            tableBody.innerHTML = '';
            
            data.forEach(vehicle => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${vehicle.id}</td>
                    <td>${vehicle.driverName}</td>
                    <td>${vehicle.mobile}</td>
                    <td>${vehicle.store || '-'}</td>
                    <td>${vehicle.vehicleType}</td>
                    <td>${vehicle.vehicleNumber}</td>
                    <td>${vehicle.vehicleModel || '-'}</td>
                    <td>${vehicle.year || '-'}</td>
                    <td>
                        <span class="status-badge ${getAdvertStatusClass(vehicle)}">
                            ${getAdvertStatusText(vehicle)}
                        </span>
                    </td>
                    <td>${vehicle.expDate ? formatDate(vehicle.expDate) : '-'}</td>
                    <td>${vehicle.company || '-'}</td>
                    <td class="action-cell">
                        <button class="action-btn edit-btn" onclick="editVehicle(${vehicle.id}, 'naif')">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="action-btn delete-btn" onclick="deleteVehicle(${vehicle.id}, 'naif')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // تطبيق فلتر موزعين نايف (بحث ديناميكي + حالة الإعلان)
        function applyNaifFilters() {
            const searchTerm = document.getElementById('naifSearch').value.toLowerCase().trim();
            const advertFilter = document.getElementById('filterAdvert').value;
            
            let filteredData = vehiclesData.naif;
            
            if (searchTerm !== '') {
                filteredData = filteredData.filter(vehicle => 
                    (vehicle.driverName && vehicle.driverName.toLowerCase().includes(searchTerm)) ||
                    (vehicle.vehicleNumber && vehicle.vehicleNumber.toLowerCase().includes(searchTerm)) ||
                    (vehicle.vehicleType && vehicle.vehicleType.toLowerCase().includes(searchTerm)) ||
                    (vehicle.store && vehicle.store.toLowerCase().includes(searchTerm))
                );
            }
            
            if (advertFilter) {
                filteredData = filteredData.filter(vehicle => vehicle.advert === advertFilter);
            }
            
            renderNaifDistributors(filteredData);
        }

        // إعادة تعيين فلاتر موزعين نايف
        function resetNaifFilters() {
            document.getElementById('naifSearch').value = '';
            document.getElementById('filterAdvert').value = '';
            renderNaifDistributors();
            showAlert('تم إعادة تعيين الفلاتر بنجاح', 'success');
        }

        // عرض الموزع الخارجي
        function renderExternalDistributors() {
            const tableBody = document.getElementById('externalTableBody');
            tableBody.innerHTML = '';
            
            vehiclesData.external.forEach((vehicle, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${vehicle.driverName}</td>
                    <td>${vehicle.mobile || '-'}</td>
                    <td>${vehicle.vehicleType}</td>
                    <td>${vehicle.vehicleType2 || '-'}</td>
                    <td>${vehicle.year || '-'}</td>
                    <td>${vehicle.store || '-'}</td>
                    <td>${vehicle.remarks || '-'}</td>
                    <td class="action-cell">
                        <button class="action-btn edit-btn" onclick="editExternalVehicle(${index})">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="action-btn delete-btn" onclick="deleteExternalVehicle(${index})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // تصفية جدول الموزع الخارجي
        function filterExternalTable(searchTerm) {
            const tableBody = document.getElementById('externalTableBody');
            const rows = tableBody.querySelectorAll('tr');
            
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(searchTerm) ? '' : 'none';
            });
        }

        // عرض الفروع
        function renderStores() {
            const storeVehicleCounts = {};
            const storeCarCounts = {};
            const storeBikeCounts = {};
            
            [...vehiclesData.naif, ...vehiclesData.external].forEach(vehicle => {
                if (vehicle.store) {
                    storeVehicleCounts[vehicle.store] = (storeVehicleCounts[vehicle.store] || 0) + 1;
                    const type = vehicle.vehicleType.toLowerCase();
                    if (type.includes('سياره') || type.includes('car') || type.includes('نيسان') || type.includes('تويتا') || type.includes('تويوتا') || type.includes('سوزوكي') || type.includes('كيا') || type.includes('كورولا') || type.includes('جيلي') || type.includes('شانجان') || type.includes('رينو') || type.includes('شيرى') || type.includes('ميتسوبيش') || type.includes('ماتسوبيشى') || type.includes('دياهتسو') || type.includes('سيلره') || type.includes('سوزكي') || type.includes('لانسر')) {
                        storeCarCounts[vehicle.store] = (storeCarCounts[vehicle.store] || 0) + 1;
                    } else if (type.includes('بجاج') || type.includes('bike') || type.includes('bk') || type.includes('هيرو') || type.includes('sym') || type.includes('دراجه') || type.includes('سيكل') || type.includes('بيجاج') || type.includes('هوندا') || type.includes('بوكسر') || type.includes('بوكس')) {
                        storeBikeCounts[vehicle.store] = (storeBikeCounts[vehicle.store] || 0) + 1;
                    }
                }
            });
            
            const allStoreNames = [...new Set([...Object.keys(storeVehicleCounts), ...allStores])].sort();
            const tableBody = document.getElementById('storesTableBody');
            tableBody.innerHTML = '';
            
            allStoreNames.forEach(storeName => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${storeName}</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>
                        <span class="status-badge ${storeVehicleCounts[storeName] > 0 ? 'status-active' : 'status-inactive'}">
                            ${storeVehicleCounts[storeName] || 0}
                        </span>
                    </td>
                    <td>${storeCarCounts[storeName] || 0}</td>
                    <td>${storeBikeCounts[storeName] || 0}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        // دوال إدارة المركبات (إضافة، تعديل، حذف)
        function openVehicleForm(action, distributorType, vehicleId = null) {
            currentEditId = vehicleId;
            const modal = document.getElementById('vehicleModal');
            const modalTitle = document.getElementById('modalTitle');
            const distributorTypeGroup = document.getElementById('distributorTypeGroup');
            
            if (action === 'add') {
                modalTitle.textContent = 'إضافة مركبة جديدة';
                document.getElementById('vehicleForm').reset();
                distributorTypeGroup.style.display = 'block';
                document.querySelector(`input[name="distributorType"][value="${distributorType}"]`).checked = true;
            } else {
                modalTitle.textContent = 'تعديل بيانات المركبة';
                distributorTypeGroup.style.display = 'none';
                
                let vehicle;
                if (distributorType === 'naif') {
                    vehicle = vehiclesData.naif.find(v => v.id === vehicleId);
                } else {
                    vehicle = vehiclesData.external[vehicleId];
                }
                
                if (vehicle) {
                    document.getElementById('driverName').value = vehicle.driverName || '';
                    document.getElementById('mobile').value = vehicle.mobile || '';
                    document.getElementById('store').value = vehicle.store || '';
                    document.getElementById('vehicleType').value = vehicle.vehicleType || '';
                    document.getElementById('vehicleNumber').value = vehicle.vehicleNumber || '';
                    document.getElementById('vehicleModel').value = vehicle.vehicleModel || '';
                    document.getElementById('year').value = vehicle.year || currentYear;
                    document.getElementById('advert').value = vehicle.advert || '';
                    document.getElementById('expDate').value = vehicle.expDate ? formatDateForInput(vehicle.expDate) : '';
                    document.getElementById('company').value = vehicle.company || vehicle.remarks || '';
                    document.getElementById('remarks').value = vehicle.remarks || '';
                    
                    document.querySelector(`input[name="distributorType"][value="${distributorType}"]`).checked = true;
                }
            }
            
            modal.classList.add('active');
        }

        function closeVehicleForm() {
            document.getElementById('vehicleModal').classList.remove('active');
            document.getElementById('vehicleForm').reset();
            currentEditId = null;
        }

        function handleVehicleFormSubmit(e) {
            e.preventDefault();
            
            const driverName = document.getElementById('driverName').value;
            const mobile = document.getElementById('mobile').value;
            const store = document.getElementById('store').value;
            const vehicleType = document.getElementById('vehicleType').value;
            const vehicleNumber = document.getElementById('vehicleNumber').value;
            const vehicleModel = document.getElementById('vehicleModel').value;
            const year = document.getElementById('year').value;
            const advert = document.getElementById('advert').value;
            const expDate = document.getElementById('expDate').value;
            const company = document.getElementById('company').value;
            const remarks = document.getElementById('remarks').value;
            
            const distributorType = document.querySelector('input[name="distributorType"]:checked').value;
            
            if (currentEditId === null) {
                if (distributorType === 'naif') {
                    const newId = vehiclesData.naif.length > 0 ? Math.max(...vehiclesData.naif.map(v => v.id)) + 1 : 1;
                    vehiclesData.naif.push({
                        id: newId, fileNum: '', driverName, mobile, store, vehicleType, vehicleNumber,
                        vehicleModel, year, advert, expDate, remarks, company
                    });
                    showAlert('تمت إضافة المركبة بنجاح إلى موزعين نايف', 'success');
                } else {
                    vehiclesData.external.push({
                        driverName, mobile, vehicleType, vehicleType2: vehicleType, year, store, remarks: company || remarks
                    });
                    showAlert('تمت إضافة المركبة بنجاح إلى الموزع الخارجي', 'success');
                }
            } else {
                if (distributorType === 'naif') {
                    const index = vehiclesData.naif.findIndex(v => v.id === currentEditId);
                    if (index !== -1) {
                        vehiclesData.naif[index] = { ...vehiclesData.naif[index], driverName, mobile, store,
                            vehicleType, vehicleNumber, vehicleModel, year, advert, expDate, remarks, company };
                    }
                    showAlert('تم تعديل بيانات المركبة بنجاح', 'success');
                } else {
                    vehiclesData.external[currentEditId] = { driverName, mobile, vehicleType, vehicleType2: vehicleType,
                        year, store, remarks: company || remarks };
                    showAlert('تم تعديل بيانات المركبة بنجاح', 'success');
                }
            }
            
            renderNaifDistributors();
            renderExternalDistributors();
            renderDashboard();
            renderStores();
            calculateStatistics();
            loadAllData();
            closeVehicleForm();
        }

        // دوال الحذف والتعديل العامة
        window.editVehicle = function(id, type) {
            openVehicleForm('edit', type, id);
        };
        
        window.editExternalVehicle = function(index) {
            openVehicleForm('edit', 'external', index);
        };
        
        window.deleteVehicle = function(id, type) {
            if (confirm('هل أنت متأكد من حذف هذه المركبة؟')) {
                if (type === 'naif') {
                    const index = vehiclesData.naif.findIndex(v => v.id === id);
                    if (index !== -1) vehiclesData.naif.splice(index, 1);
                }
                renderNaifDistributors();
                renderDashboard();
                renderStores();
                calculateStatistics();
                loadAllData();
                showAlert('تم حذف المركبة بنجاح', 'success');
            }
        };
        
        window.deleteExternalVehicle = function(index) {
            if (confirm('هل أنت متأكد من حذف هذه المركبة؟')) {
                vehiclesData.external.splice(index, 1);
                renderExternalDistributors();
                renderStores();
                calculateStatistics();
                loadAllData();
                showAlert('تم حذف المركبة بنجاح', 'success');
            }
        };

        // دوال التقارير (PDF، معاينة)
        function updateReportPreview() {
            const reportType = document.getElementById('reportType').value;
            const reportStore = document.getElementById('reportStore').value;
            const reportMonth = document.getElementById('reportMonth').value;
            
            let reportData = [];
            let reportTitle = '';
            
            if (reportType === 'summary') {
                reportTitle = 'تقرير ملخص المركبات';
                reportData = [...vehiclesData.naif, ...vehiclesData.external.map(v => ({
                    ...v, id: '', fileNum: '', vehicleModel: v.vehicleType2, advert: '', expDate: '', company: v.remarks
                }))];
            } else if (reportType === 'advert_status') {
                reportTitle = 'تقرير حالة الإعلانات';
                reportData = vehiclesData.naif.filter(v => v.advert);
            } else if (reportType === 'by_store') {
                reportTitle = 'تقرير حسب الفرع';
                if (reportStore) {
                    reportData = [...vehiclesData.naif, ...vehiclesData.external].filter(v => v.store === reportStore);
                } else {
                    reportData = [...vehiclesData.naif, ...vehiclesData.external];
                }
            } else if (reportType === 'by_vehicle_type') {
                reportTitle = 'تقرير حسب نوع المركبة';
                reportData = [...vehiclesData.naif, ...vehiclesData.external];
            } else if (reportType === 'expiring_soon') {
                reportTitle = 'تقرير الإعلانات المنتهية قريباً';
                reportData = vehiclesData.naif.filter(vehicle => {
                    if (vehicle.advert !== 'يوجد اعلان' || !vehicle.expDate) return false;
                    const diffDays = Math.ceil((new Date(vehicle.expDate) - new Date()) / (1000 * 60 * 60 * 24));
                    return diffDays > 0 && diffDays <= 30;
                });
            }
            
            if (reportMonth) {
                reportData = reportData.filter(vehicle => {
                    if (!vehicle.expDate) return false;
                    const month = String(new Date(vehicle.expDate).getMonth() + 1).padStart(2, '0');
                    return month === reportMonth;
                });
            }
            
            const reportContent = document.getElementById('reportContent');
            if (reportData.length === 0) {
                reportContent.innerHTML = `<div style="text-align: center; padding: 40px;">لا توجد بيانات</div>`;
                return;
            }
            
            // عرض معاينة مبسطة
            let html = `<h3>${reportTitle}</h3><p>إجمالي المركبات: ${reportData.length}</p>`;
            reportContent.innerHTML = html;
        }

        // دوال مساعدة لتنسيق التاريخ
        function formatDate(dateString) {
            if (!dateString) return '';
            try {
                const date = new Date(dateString);
                return `${String(date.getDate()).padStart(2, '0')}-${String(date.getMonth() + 1).padStart(2, '0')}-${date.getFullYear()}`;
            } catch {
                return dateString;
            }
        }

        function formatDateForInput(dateString) {
            if (!dateString) return '';
            try {
                const date = new Date(dateString);
                return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            } catch {
                return dateString;
            }
        }
